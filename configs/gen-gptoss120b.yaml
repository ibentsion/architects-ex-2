extends: configs/default.yaml
generation: {model: openai/gpt-oss-120b, max_tokens: 4096}
# max_tokens bumped from the default 1024: gpt-oss is a reasoning model that
# spends part of its budget on hidden chain-of-thought before visible output
# (same reason evalharness/judge.py uses 4096 for reasoning-model judges) --
# 1024 caused truncated/empty completions (content=None) mid-batch.
